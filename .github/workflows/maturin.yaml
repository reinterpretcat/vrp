name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

# vrp-cli enables pyo3's abi3-py310 feature, so each platform produces a single stable-ABI wheel
# (cp310-abi3) that works on CPython 3.10 and every later version. No per-interpreter builds needed.
jobs:
  bindings:
    name: Generate bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install code generators
        run: |
          npm ci --prefix vrp-cli/bindings/typescript --no-audit --no-fund
          python -m pip install --quiet -r vrp-cli/bindings/python/requirements-codegen.txt
      - name: Generate bindings from the rust types
        run: ./vrp-cli/bindings/generate.sh
      - name: Upload generated bindings
        uses: actions/upload-artifact@v7
        with:
          name: generated-bindings
          if-no-files-found: error
          path: |
            vrp-cli/bindings/schemas/*.schema.json
            vrp-cli/bindings/python/vrp_cli/models/*.py
            !vrp-cli/bindings/python/vrp_cli/models/__init__.py
            !vrp-cli/bindings/python/vrp_cli/models/_base.py
            vrp-cli/bindings/typescript/format_types.d.ts

  linux:
    name: Build linux wheel (${{ matrix.target }})
    needs: bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # aarch64 covers arm servers and 64-bit arm linux generally; without a wheel for it,
        # `pip install vrp-cli` there fails outright, since no sdist is published to fall back on
        target: [x86_64, aarch64, armv7]
    steps:
      - uses: actions/checkout@v7
      - name: Download generated bindings
        uses: actions/download-artifact@v8
        with:
          name: generated-bindings
          path: vrp-cli/bindings
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ./vrp-cli
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
          manylinux: auto
      # artifact names must be unique per job: upload-artifact v4+ rejects duplicates
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: ./vrp-cli/dist

  windows:
    name: Build windows wheel (${{ matrix.target }})
    needs: bindings
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v7
      - name: Download generated bindings
        uses: actions/download-artifact@v8
        with:
          name: generated-bindings
          path: vrp-cli/bindings
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # the interpreter architecture must match the wheel architecture for linking
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ./vrp-cli
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: ./vrp-cli/dist

  macos:
    name: Build macos wheel (${{ matrix.target }})
    needs: bindings
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: Download generated bindings
        uses: actions/download-artifact@v8
        with:
          name: generated-bindings
          path: vrp-cli/bindings
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ./vrp-cli
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: ./vrp-cli/dist

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    steps:
      # collect every per-platform artifact back into a single directory
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List wheels
        run: ls -l dist
      # NOTE: PyPI trusted publishing (OIDC) would remove the need for a long-lived token here.
      # It requires configuring a trusted publisher on the PyPI project side, then replacing
      # MATURIN_PYPI_TOKEN with `permissions: id-token: write` on this job.
      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing dist/*
