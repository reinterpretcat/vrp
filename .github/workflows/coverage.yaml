name: Measure code coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # profile.test sets opt-level = 1 globally, which distorts coverage line mapping, so reset it here
  CARGO_PROFILE_TEST_OPT_LEVEL: 0

jobs:
  measure-test-coverage:
    name: Tarpaulin
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      # ~/.cargo/bin is cached so cargo-tarpaulin is compiled once rather than on every run
      - name: Cache cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-
      - name: Install cargo-tarpaulin
        run: |
          if ! command -v cargo-tarpaulin >/dev/null; then
            cargo install cargo-tarpaulin --locked
          fi
          cargo tarpaulin --version
      - name: Generate code coverage
        run: >-
          cargo tarpaulin --locked
          --exclude-files '*_test.rs' '*tests*' '*benches*' '*heuristic-research*'
          --out xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          fail_ci_if_error: false
      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: cobertura.xml
