name: Publish release assets

on:
  release:
    types: [published]
  # Rebuilding a tag by hand is what turns one flaky target from a lost release into a retry:
  # the upload waits on the whole matrix, so a single failed leg still leaves the release with
  # no assets. Dispatching the same tag again rebuilds every target and clobbers what is there.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and upload assets for
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-binaries:
    name: Build ${{ matrix.asset_target }}
    runs-on: ${{ matrix.os }}
    # A build that cannot finish in half an hour is stuck, not slow: the slowest target takes six
    # minutes. Without this the job runs to GitHub's six-hour default, and because the upload waits
    # on every target, one wedged runner leaves the release with no assets at all — which it did,
    # twice, on v0.1.14 and v0.1.15.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A cross-compiled target names its own `apt_packages` and `linker`; everything else about
        # a target is the same three fields. Adding one is a row here, never a new build step.
        #
        # Linux builds run on the OLDEST supported runner on purpose. A glibc-linked binary runs
        # against its build-time glibc or newer and never older, so building on `ubuntu-latest`
        # silently raises the floor the day that label moves — and the worker snapshot boots
        # Ubuntu 24.04. 22.04 (glibc 2.35) clears every machine we deploy on with room to spare.
        # Static musl builds would drop the floor entirely, but musl's allocator is slow under the
        # threaded, allocation-heavy search this binary does, so the portability is not worth it.
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_target: linux-x86_64
            archive_ext: tar.gz
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            asset_target: linux-aarch64
            archive_ext: tar.gz
            # Both halves, or the link fails: the compiler driver AND the ARM64 libc that carries
            # crti.o. Installing only the driver is what broke v0.1.16 and v0.1.17.
            apt_packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_target: macos-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_target: macos-aarch64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_target: windows-x86_64
            archive_ext: zip
    steps:
      - name: Check out the tag being published
        uses: actions/checkout@v4
        with:
          # Explicit, because a dispatched run defaults to the branch the workflow came from —
          # which would build master's code and upload it under a tag's name. A release event
          # already checks this commit out; saying so keeps both entry points honest.
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation packages
        if: matrix.apt_packages != ''
        # Both earlier hangs sat here, in `apt-get update`, never reaching the compiler.
        # `noninteractive` takes away apt's one way of waiting for an answer nobody is there to
        # give, and the step timeout bounds a mirror that stops responding — a retry costs a
        # minute, the wedge cost three hours.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt_packages }}

      - name: Build vrp-cli
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_LINKER: ${{ matrix.linker }}
        run: |
          set -euo pipefail

          # Cargo takes a cross linker from CARGO_TARGET_<TARGET>_LINKER, the triple upper-cased
          # with dashes as underscores. Deriving it keeps the target list the only place that
          # knows about cross-compiling.
          if [ -n "${MATRIX_LINKER}" ]; then
            linker_var="CARGO_TARGET_$(printf '%s' "${MATRIX_TARGET}" | tr 'a-z-' 'A-Z_')_LINKER"
            echo "using ${linker_var}=${MATRIX_LINKER}"
            export "${linker_var}=${MATRIX_LINKER}"
          fi

          cargo build -p vrp-cli --release --locked --target "${MATRIX_TARGET}"

      - name: Package binary
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          ASSET_TARGET: ${{ matrix.asset_target }}
        run: |
          set -euo pipefail
          [ -n "${RELEASE_TAG}" ] || { echo "RELEASE_TAG is empty"; exit 1; }
          out_dir="release-artifacts"
          mkdir -p "$out_dir"

          if [ "${{ runner.os }}" = "Windows" ]; then
            bin_path="target/${MATRIX_TARGET}/release/vrp-cli.exe"
            archive_path="$out_dir/vrp-cli-${RELEASE_TAG}-${ASSET_TARGET}.zip"
            7z a -tzip "$archive_path" "$bin_path" > /dev/null
          else
            bin_path="target/${MATRIX_TARGET}/release/vrp-cli"
            archive_path="$out_dir/vrp-cli-${RELEASE_TAG}-${ASSET_TARGET}.tar.gz"
            tar -czf "$archive_path" -C "$(dirname "$bin_path")" "$(basename "$bin_path")"
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: vrp-cli-${{ matrix.asset_target }}
          path: release-artifacts/
          if-no-files-found: error

  create-checksums:
    name: Create checksums
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: vrp-cli-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-artifacts
          shasum -a 256 vrp-cli-* > SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release-artifacts/SHA256SUMS
          if-no-files-found: error

  upload-release-assets:
    name: Upload assets to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, create-checksums]
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: vrp-cli-*
          path: release-artifacts
          merge-multiple: true

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: release-artifacts

      - name: List files to upload
        run: |
          set -euo pipefail
          ls -la release-artifacts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${RELEASE_TAG}" ] || { echo "RELEASE_TAG is empty"; exit 1; }

          mapfile -t files < <(find release-artifacts -maxdepth 1 -type f \( -name 'vrp-cli-*' -o -name 'SHA256SUMS' \) | sort)
          [ "${#files[@]}" -gt 0 ] || { echo "No release files found to upload"; exit 1; }

          for file in "${files[@]}"; do
            name="$(basename "$file")"
            gh release upload "$RELEASE_TAG" "$file#$name" --clobber --repo "$GH_REPO"
          done
