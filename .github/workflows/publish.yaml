name: Publish packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, e.g. v1.26.0 (must match the vrp-cli version)'
        required: true
        type: string
      docker_tag:
        description: 'Docker image tag'
        required: true
        type: string
      dry_run:
        description: 'Rehearse the release without publishing anything'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# a publish must never be cancelled halfway through, and two must never interleave
concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # everything that can fail without side effects happens here, before anything irreversible
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Cache cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-
      # catches the classic mistake of tagging v1.26.0 while the manifests still say 1.25.0
      - name: Check release tag matches workspace version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # the tag tracks vrp-cli, the main published artifact. NOTE: rosomaxa is versioned
          # independently on a 0.9.x line, so this must not be read from an arbitrary package.
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "vrp-cli") | .version')"
          expected="${RELEASE_TAG#v}"
          echo "vrp-cli version: ${version}"
          echo "release tag: ${RELEASE_TAG} (normalised to ${expected})"
          if [ -z "${version}" ]; then
            echo "::error::could not resolve the vrp-cli version"
            exit 1
          fi
          if [ "${version}" != "${expected}" ]; then
            echo "::error::release tag ${RELEASE_TAG} does not match vrp-cli version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --workspace --benches
      # proves every crate can be packaged and built from its packaged form, resolving
      # intra-workspace dependencies locally, so packaging errors surface before any upload
      - name: Pre-flight package all crates
        run: cargo package --locked --workspace
      - name: Summarise the release plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "### Release plan"
            echo ""
            echo "dry run: \`${DRY_RUN}\`"
            echo ""
            echo "| crate | version | already on crates.io |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          for crate in rosomaxa vrp-core vrp-scientific vrp-pragmatic vrp-cli; do
            v="$(jq -r --arg c "${crate}" '.packages[] | select(.name == $c) | .version' <<< "${metadata}")"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H 'User-Agent: vrp-release-workflow' \
              "https://crates.io/api/v1/crates/${crate}/${v}" || echo 000)"
            if [ "${code}" = 200 ]; then state='yes, will skip'; else state='no'; fi
            echo "| ${crate} | ${v} | ${state} |" >> "$GITHUB_STEP_SUMMARY"
          done

  push-to-crates:
    name: Push crates to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      # Idempotent and resumable. crates.io publishes are irreversible, so a failure partway
      # through previously bricked the workflow: a re-run died on the first already-published
      # crate. Each crate is now skipped if that exact version already exists, transient upload
      # failures are retried, and the registry index is polled before a dependent crate follows.
      - name: Publish all packages from workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # sparse-index path prefix, per the cargo registry layout
          index_path() {
            local name="$1"
            case "${#name}" in
              1) printf '1/%s' "$name" ;;
              2) printf '2/%s' "$name" ;;
              3) printf '3/%s/%s' "${name:0:1}" "$name" ;;
              *) printf '%s/%s/%s' "${name:0:2}" "${name:2:2}" "$name" ;;
            esac
          }

          is_published() {
            local name="$1" version="$2"
            curl -sS --max-time 30 "https://index.crates.io/$(index_path "${name}")" 2>/dev/null \
              | jq -r '.vers' 2>/dev/null \
              | grep -Fxq "${version}"
          }

          wait_for_index() {
            local name="$1" version="$2"
            for _ in $(seq 1 60); do
              if is_published "${name}" "${version}"; then
                echo "  ${name} ${version} is visible on the index"
                return 0
              fi
              sleep 5
            done
            echo "::error::${name} ${version} did not appear on the registry index within 5 minutes"
            return 1
          }

          publish_with_retry() {
            local crate="$1" version="$2"
            for attempt in 1 2 3; do
              if cargo publish --locked -p "${crate}"; then
                return 0
              fi
              # the upload can succeed even when the client reports a transport error
              if is_published "${crate}" "${version}"; then
                echo "  ${crate} landed despite the reported error"
                return 0
              fi
              echo "::warning::publishing ${crate} failed (attempt ${attempt}/3), retrying"
              sleep $((attempt * 30))
            done
            echo "::error::could not publish ${crate} after 3 attempts"
            return 1
          }

          # each crate carries its own version: rosomaxa is on an independent 0.9.x line while
          # the vrp-* crates share the workspace version, so versions are resolved per package
          metadata="$(cargo metadata --no-deps --format-version 1)"

          for crate in rosomaxa vrp-core vrp-scientific vrp-pragmatic vrp-cli; do
            version="$(jq -r --arg c "${crate}" '.packages[] | select(.name == $c) | .version' <<< "${metadata}")"
            if [ -z "${version}" ]; then
              echo "::error::could not resolve a version for ${crate}"
              exit 1
            fi
            echo "::group::${crate} ${version}"
            if is_published "${crate}" "${version}"; then
              echo "  already published, skipping"
            elif [ "${DRY_RUN}" = 'true' ]; then
              echo "  dry run: would publish ${crate} ${version}"
            else
              publish_with_retry "${crate}" "${version}"
              wait_for_index "${crate}" "${version}"
            fi
            echo "::endgroup::"
          done

  push-to-registry:
    name: Push docker image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # publishing to GHCR needs only the workflow token, not a personal access token
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # a dry run still builds the image, it just does not push it
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          tags: ghcr.io/${{ github.repository }}/vrp-cli:${{ inputs.docker_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-release:
    name: Push release on github
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # creating a release and uploading its asset writes to the repository
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Cache cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            cargo install wasm-pack --locked
          fi
          wasm-pack --version
      - name: Build WebAssembly artefact
        working-directory: ./vrp-cli
        run: wasm-pack build --target web
      - name: Archive artifacts
        run: zip -qq -r vrp_cli_wasm.zip vrp-cli/pkg
      # Idempotent: re-running after a partial failure updates the existing release instead of
      # failing on a duplicate tag. The preinstalled GitHub CLI replaces the archived
      # actions/create-release and actions/upload-release-asset pair, and the tag is passed
      # through the environment so a crafted dispatch input cannot inject script.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = 'true' ]; then
            echo "dry run: would publish ${RELEASE_TAG} with vrp_cli_wasm.zip"
            ls -l vrp_cli_wasm.zip
            exit 0
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists, updating its asset"
            gh release upload "${RELEASE_TAG}" vrp_cli_wasm.zip --clobber
          else
            gh release create "${RELEASE_TAG}" vrp_cli_wasm.zip \
              --title "${RELEASE_TAG}" \
              --notes ""
          fi
