name: Publish release assets

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-binaries:
    name: Build ${{ matrix.asset_target }}
    runs-on: ${{ matrix.os }}
    # A build that cannot finish in half an hour is stuck, not slow: the slowest target takes six
    # minutes. Without this the job runs to GitHub's six-hour default, and because the upload waits
    # on every target, one wedged runner leaves the release with no assets at all — which it did,
    # twice, on v0.1.14 and v0.1.15.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_target: linux-x86_64
            archive_ext: tar.gz
          # No ARM64 Linux target. Nothing we run is ARM Linux — the solver pool boots x86 boxes
          # and the worker provisioning fetches linux-x86_64 by name — and cross-compiling it is
          # what broke the last two releases: the runner image carries the aarch64 gcc driver but
          # no ARM64 libc, so linking dies on a missing crti.o. Because the upload waits on the
          # whole matrix, that one target left v0.1.16 and v0.1.17 with no assets at all. If ARM64
          # Linux is ever needed, build it on a native arm64 runner instead of cross-linking.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_target: macos-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_target: macos-aarch64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_target: windows-x86_64
            archive_ext: zip
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build vrp-cli
        run: cargo build -p vrp-cli --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          target="${{ matrix.target }}"
          asset_target="${{ matrix.asset_target }}"
          out_dir="release-artifacts"
          mkdir -p "$out_dir"

          if [ "${{ runner.os }}" = "Windows" ]; then
            bin_path="target/$target/release/vrp-cli.exe"
            archive_path="$out_dir/vrp-cli-${tag}-${asset_target}.zip"
            7z a -tzip "$archive_path" "$bin_path" > /dev/null
          else
            bin_path="target/$target/release/vrp-cli"
            archive_path="$out_dir/vrp-cli-${tag}-${asset_target}.tar.gz"
            tar -czf "$archive_path" -C "$(dirname "$bin_path")" "$(basename "$bin_path")"
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: vrp-cli-${{ matrix.asset_target }}
          path: release-artifacts/vrp-cli-${{ github.event.release.tag_name }}-${{ matrix.asset_target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  create-checksums:
    name: Create checksums
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: vrp-cli-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-artifacts
          shasum -a 256 vrp-cli-* > SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release-artifacts/SHA256SUMS
          if-no-files-found: error

  upload-release-assets:
    name: Upload assets to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, create-checksums]
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: vrp-cli-*
          path: release-artifacts
          merge-multiple: true

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: release-artifacts

      - name: List files to upload
        run: |
          set -euo pipefail
          ls -la release-artifacts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_TAG" ] || { echo "RELEASE_TAG is empty"; exit 1; }

          mapfile -t files < <(find release-artifacts -maxdepth 1 -type f \( -name 'vrp-cli-*' -o -name 'SHA256SUMS' \) | sort)
          [ "${#files[@]}" -gt 0 ] || { echo "No release files found to upload"; exit 1; }

          for file in "${files[@]}"; do
            name="$(basename "$file")"
            gh release upload "$RELEASE_TAG" "$file#$name" --clobber --repo "$GH_REPO"
          done
