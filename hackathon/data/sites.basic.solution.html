  <style>

    :root {
      --bg: #0b0f14;
      --ink: #e8edf2;
      --muted: #8b97a8;
      --line: #243042;
    }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      padding: 18px 24px 12px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .chips { display: flex; gap: 10px; flex-wrap: wrap; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      padding: 6px 10px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
    }
    .chip i {
      width: 8px;
      height: 8px;
      display: inline-block;
    }
    .map-wrap { height: 62vh; min-height: 420px; }
    .map-wrap .folium-map { height: 100%; width: 100%; }
    .board {
      padding: 8px 24px 28px;
    }
    .board h2 {
      margin: 18px 0 4px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .empty { color: var(--muted); }
    .stop-card {
      font-family: "IBM Plex Sans", sans-serif;
      min-width: 220px;
      color: #1b1f24;
    }
    .stop-card .kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #66707c;
    }
    .stop-card .title {
      font-size: 16px;
      font-weight: 600;
      margin: 4px 0 10px;
    }
    .stop-card .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 13px;
      padding: 3px 0;
      border-top: 1px solid #e4e0d7;
    }
    .stop-card span { color: #66707c; }
    .leaflet-popup-content-wrapper { border-radius: 2px; }
