[package]
name = "vrp-cli"
description = "A command line interface for VRP solver"
version.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
# The TypeScript declarations are generated before release rather than committed. `include` both
# overrides gitignore for that file and keeps the published Rust crate deliberately small.
include = ["src/**", "tests/**", "examples/**", "bindings/typescript/format_types.d.ts"]

[features]
default = ["vrp-core", "csv-format", "scientific-format"]

csv-format = ["csv"]
scientific-format = ["vrp-scientific"]
py_bindings = ["dep:pyo3"]
# opt-in, non-default: derives `JsonSchema` on the config types and enables the same for the
# pragmatic format, which together let the `schema_gen` example emit the json schemas
schema = ["dep:schemars", "vrp-pragmatic/schema"]

[lib]
name = "vrp_cli"
crate-type = ["cdylib", "lib"]

# generates the json schemas; skipped unless the `schema` feature is enabled, so that `cargo test
# --all-targets` keeps working with default features
[[example]]
name = "schema_gen"
required-features = ["schema"]

[dependencies]
vrp-core = { workspace = true, optional = true }
vrp-scientific = { workspace = true, optional = true}
vrp-pragmatic.workspace = true

serde.workspace = true
serde_json.workspace = true

csv = { version = "1.3.1", optional = true }
schemars = { version = "1.2.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = "4.5.39"
ctrlc = { version = "3.4.7", features = ["termination"] }
num_cpus = "1.17.0"

# see https://github.com/xd009642/tarpaulin/issues/1092
[target.'cfg(all(not(target_arch = "wasm32"), not(tarpaulin)))'.dependencies]
# abi3-py310 builds a single stable-ABI extension that works on CPython 3.10 and every later version,
# instead of one wheel per interpreter. 3.10 matches the floor the release workflow already targeted.
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.100" }
# the wasm binding converts arguments with the engine's own JSON implementation, so no serde based
# javascript bridge is needed
js-sys = "0.3.77"
# without a panic hook a panic surfaces as a bare "unreachable executed" with no message
console_error_panic_hook = "0.1.7"

[dev-dependencies]
tempfile = "3.20.0"
