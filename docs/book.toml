[book]
authors = ["Ilya Builuk <ilya.builuk@gmail.com>"]
description = "This book describes a Vehicle Routing Problem solver."
language = "en"
src = "src"
title = "A Vehicle Routing Problem Solver Documentation"

# renders the plantuml diagrams; install with `cargo install mdbook-puml`.
# optional so that the book still builds without it, just with the diagrams left as source
[preprocessor.puml]
optional = true

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/reinterpretcat/vrp/"
additional-css = [
    "resources/leaflet.css"
]
additional-js = [
    "resources/leaflet.js",
    "resources/map.js"
]

[output.html.fold]
enable = true
level = 1
