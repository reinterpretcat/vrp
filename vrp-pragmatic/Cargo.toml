[package]
name = "vrp-pragmatic"
description = "An extension logic for solving rich VRP"
version.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# opt-in, non-default: derives `JsonSchema` on the pragmatic format types so that a json schema can
# be generated from them. Kept out of the default set so that normal builds and downstream users are
# not affected by the extra dependency.
schema = ["dep:schemars"]

[dependencies]
vrp-core.workspace = true

serde.workspace = true
serde_json.workspace = true
rand.workspace = true

time = { version = "0.3.55", features = ["parsing", "formatting"] }
paste = "1.0.15"
schemars = { version = "1.2.2", optional = true }

[dev-dependencies]
criterion.workspace = true

proptest = "1.9.0"
uuid = { version = "1.17.0", features = ["v4"] }

[[bench]]
name = "pragmatic_simple"
harness = false
