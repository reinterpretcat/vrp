# getrandom 0.3 (pulled in by rand 0.9) needs an explicit backend selection on wasm32-unknown-unknown,
# where no OS entropy source exists. This replaces the `js` feature flag used by getrandom 0.2.
# See https://docs.rs/getrandom/0.3/getrandom/#webassembly-support
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
